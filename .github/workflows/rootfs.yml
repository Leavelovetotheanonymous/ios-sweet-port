name: rootfs

# Build the iOS root filesystem image on a stock ubuntu-latest runner, so no
# local Linux VM (and therefore no BIOS VT-x/SVM) is ever needed.
#
# mkiosroot.sh needs: apfs-fuse (read the LZBITMAP-compressed APFS images),
# mkfs.hfsplus (case-sensitive journaled HFS+, which XNU mounts fine), loop
# mounts and root. A GitHub-hosted Ubuntu VM has all four; this machine does
# not. The IPSW is pulled straight from Apple's CDN via api.ipsw.me, so it is
# never uploaded anywhere.
#
# Output: ios16-root.img.zst.part-* as release assets (2 GB per asset limit),
# plus SHA256SUMS. Download the parts, `cat` them together, `zstd -d`.

on:
  workflow_dispatch:
    inputs:
      device:
        description: api.ipsw.me identifier
        default: "iPhone10,3"
      version:
        description: iOS version
        default: "16.7.16"
      build:
        description: build id
        default: "20H392"
      size:
        description: image size passed to mkiosroot.sh
        default: "16G"
      part_mb:
        description: release asset part size (MB)
        default: "1900"
      upload:
        description: publish image as split release assets
        default: "true"

permissions:
  contents: write

concurrency:
  group: rootfs-${{ inputs.device }}
  cancel-in-progress: false

env:
  DEVICE: ${{ inputs.device || 'iPhone10,3' }}
  VERSION: ${{ inputs.version || '16.7.16' }}
  BUILDID: ${{ inputs.build || '20H392' }}
  IMG_SIZE: ${{ inputs.size || '16G' }}
  PART_MB: ${{ inputs.part_mb || '1900' }}
  TAG: rootfs-${{ inputs.device || 'iPhone10,3' }}-${{ inputs.version || '16.7.16' }}

jobs:
  rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Default runner has ~14 GB free; a 5.8 GB IPSW + 7 GB of dmg + a 16 GB
        # (sparse, ~7 GB used) HFS+ image do not fit in that.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /opt/az /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config libfuse3-dev libbz2-dev \
            zlib1g-dev fuse3 rsync curl unzip zstd python3 ca-certificates
          # hfsprogs was dropped from noble; take the newest amd64 build that
          # still exists in the archive pool instead of trying to guess a name.
          if ! sudo apt-get install -y --no-install-recommends hfsprogs; then
            deb=$(curl -fsSL http://archive.ubuntu.com/ubuntu/pool/universe/h/hfsprogs/ \
                  | grep -o 'hfsprogs_[^"]*_amd64\.deb' | sort -u | tail -1)
            echo "falling back to $deb"
            curl -fsSL -O "http://archive.ubuntu.com/ubuntu/pool/universe/h/hfsprogs/$deb"
            sudo dpkg -i "$deb"
          fi
          export PATH="$PATH:/sbin:/usr/sbin"
          for t in apfs-fuse mkfs.hfsplus fsck.hfsplus rsync; do
            command -v "$t" || { echo "missing $t" >&2; exit 1; }
          done
          sudo modprobe hfsplus && echo "hfsplus module loaded" || \
            echo "::warning::no hfsplus module; the loop mount below will fail"

      - name: Build apfs-fuse
        run: |
          git clone --depth 1 https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build \
                -DUSE_FUSE3=ON -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build /tmp/apfs-fuse/build -j"$(nproc)" --target install
          # lsb_release is 22.04+; make sure the binary really runs.
          apfs-fuse 2>&1 | head -5 || true

      - name: Fetch IPSW
        run: |
          curl -fsSL "https://api.ipsw.me/v4/device/$DEVICE?type=ipsw" -o /tmp/ipsw.json
          python3 - <<'PY' > /tmp/ipsw.url
          import json, os, sys
          d = json.load(open("/tmp/ipsw.json"))
          ver, build = os.environ["VERSION"], os.environ["BUILDID"]
          hit = [f for f in d["firmwares"] if f["version"] == ver and f["buildid"] == build]
          if not hit:
              print("no such firmware; available: " + ", ".join(
                  f"{f['version']}/{f['buildid']}" for f in d["firmwares"][:10]), file=sys.stderr)
              sys.exit(1)
          print(hit[0]["url"])
          PY
          cat /tmp/ipsw.url
          curl -fL --retry 4 --retry-delay 5 -o /tmp/fw.ipsw "$(cat /tmp/ipsw.url)"
          ls -l /tmp/fw.ipsw

      - name: Extract the three images
        # BuildManifest says which numbered dmg is which; do it by key, not by
        # eyeballing file sizes.
        run: |
          python3 - <<'PY'
          import plistlib, os, zipfile, json, subprocess
          z = zipfile.ZipFile("/tmp/fw.ipsw")
          bm = plistlib.loads(z.read("BuildManifest.plist"))
          bi = bm["BuildIdentities"][0]["Manifest"]
          want = {"OS": "/tmp/OS.dmg",
                  "Cryptex1,SystemOS": "/tmp/SYSTEMOS.dmg",
                  "Cryptex1,AppOS": "/tmp/APPOS.dmg"}
          plan = {}
          for key, dst in want.items():
              src = bi[key]["Info"]["Path"]
              plan[src] = dst
          print(json.dumps(plan, indent=1))
          for src, dst in plan.items():
              subprocess.check_call(["unzip", "-o", "-q", "/tmp/fw.ipsw", src, "-d", "/tmp/x"])
              os.replace(os.path.join("/tmp/x", src), dst)
          PY
          rm -f /tmp/fw.ipsw
          ls -l /tmp/*.dmg
          df -h /

      - name: Build the root image
        run: |
          sudo -E bash tools/mkiosroot.sh /tmp/OS.dmg /tmp/SYSTEMOS.dmg /tmp/APPOS.dmg \
               /tmp/ios16-root.img "$IMG_SIZE"
          ls -l /tmp/ios16-root.img
          du -h --apparent-size /tmp/ios16-root.img
          du -h /tmp/ios16-root.img

      - name: Verify the image
        run: |
          fsck.hfsplus -f -n /tmp/ios16-root.img
          # Spot-check the two things SWEET added on purpose.
          sudo mkdir -p /mnt/chk
          sudo mount -t hfsplus -o loop,ro,force /tmp/ios16-root.img /mnt/chk
          ls /mnt/chk/System/Library/Caches/com.apple.dyld | head -3
          ls -l /mnt/chk/private/var/keybags/systembag.kb
          test -d /mnt/chk/private/preboot/Cryptexes/OS/System
          sudo umount /mnt/chk

      - name: Compress and split
        run: |
          mkdir -p /tmp/out
          zstd -T0 -19 --long=27 -o /tmp/out/ios16-root.img.zst /tmp/ios16-root.img
          rm -f /tmp/ios16-root.img
          cd /tmp/out
          split -b "${PART_MB}M" -d -a 2 ios16-root.img.zst ios16-root.img.zst.part-
          rm -f ios16-root.img.zst
          sha256sum ios16-root.img.zst.part-* > SHA256SUMS
          ls -l; df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: ios16-root-zst-parts
          path: /tmp/out/*
          if-no-files-found: error

      - name: Publish as release assets
        if: ${{ inputs.upload != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "iOS $VERSION ($BUILDID) root filesystem" \
              --notes "Built by .github/workflows/rootfs.yml from Apple's IPSW with tools/mkiosroot.sh."
          gh release upload "$TAG" /tmp/out/* -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
