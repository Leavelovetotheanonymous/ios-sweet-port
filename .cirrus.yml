# Cirrus CI fallback for the XNU build.
#
# GitHub's hosted macOS runners never hand this (brand-new) account a machine:
# jobs sit queued and are reaped after ~15 minutes, while ubuntu-latest starts
# in seconds. Cirrus gives open-source projects free macOS VMs, so this mirrors
# .github/workflows/xnu.yml step for step.
#
# Image: Sonoma + Xcode 15.4 (matches the workflow's "macos-14 still ships
# Xcode 15.x: its iig matches the xnu-8796 IORPC ABI" requirement).
task:
  name: xnu
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sonoma-xcode:15.4
  timeout_in: 150m
  env:
    DXB_REPO: https://github.com/blacktop/darwin-xnu-build
    DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
    MACOS_VERSION: "13.5"
    KERNEL_CONFIG: DEVELOPMENT
    MACHINE_CONFIG: SWEET
  fetch_script: |
    git init -q dxb
    git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
    git -C dxb checkout -q FETCH_HEAD
    cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
    sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
    echo "ARCHS patched: $(grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh)"
    ls dxb/patches | head -20
  setup_script: |
    brew install jq cmake ninja || true
    printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
    sudo chmod +x /usr/local/bin/xcodes
    sw_vers
    ls -d /Applications/Xcode*.app
    XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
    echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$CIRRUS_ENV"
    sudo xcode-select -s "$XC"
    xcodebuild -version
    xcrun --find iig
  build_script: |
    cd dxb
    MAKEFLAGS=-k bash build.sh
  collect_script: |
    mkdir -p out
    cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
    ls -la out
    (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
    tar czf xnu-kernel.tgz -C out .
    ls -la xnu-kernel.tgz
  always:
    kernel_artifacts:
      path: "xnu-kernel.tgz"
